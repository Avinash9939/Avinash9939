<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- laptop screen glow -->
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    
    <style>
      .code-symbol {
        font-family: 'Fira Code', monospace, sans-serif;
        font-weight: bold;
        fill: rgba(124, 58, 237, 0.6);
        animation: float 4s ease-in-out infinite;
      }
      .sym-1 { animation-delay: 0s; font-size: 24px; }
      .sym-2 { animation-delay: -1s; font-size: 18px; fill: rgba(16, 185, 129, 0.6); }
      .sym-3 { animation-delay: -2s; font-size: 20px; fill: rgba(59, 130, 246, 0.6); }
      .sym-4 { animation-delay: -3s; font-size: 28px; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      
      @keyframes typing {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg); }
      }
      .arm {
        transform-origin: 300px 180px;
        animation: typing 0.4s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="150" fill="url(#screen-glow)" opacity="0.3"/>

  <!-- Floating Code Symbols -->
  <text x="80" y="100" class="code-symbol sym-1">&lt;/&gt;</text>
  <text x="350" y="80" class="code-symbol sym-2">{}</text>
  <text x="420" y="200" class="code-symbol sym-3">()</text>
  <text x="100" y="250" class="code-symbol sym-4">#</text>
  <text x="300" y="50" class="code-symbol sym-1">[]</text>

  <!-- Ground Line -->
  <rect x="50" y="320" width="400" height="4" rx="2" fill="#30363d"/>

  <!-- Chair Base -->
  <path d="M 330 320 L 330 280 L 330 320" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="310" cy="320" r="5" fill="#1f2937"/>
  <circle cx="350" cy="320" r="5" fill="#1f2937"/>
  <line x1="310" y1="315" x2="350" y2="315" stroke="#4b5563" stroke-width="4"/>
  <line x1="330" y1="315" x2="330" y2="280" stroke="#4b5563" stroke-width="6"/>

  <!-- Chair Seat & Back -->
  <rect x="290" y="260" width="70" height="20" rx="10" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="340" y="150" width="20" height="120" rx="10" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <path d="M 330 260 L 350 250" stroke="#4b5563" stroke-width="6"/>

  <!-- Desk -->
  <rect x="120" y="240" width="130" height="12" rx="4" fill="#30363d"/>
  <rect x="140" y="252" width="12" height="68" fill="#30363d"/>
  <rect x="210" y="252" width="12" height="68" fill="#30363d"/>

  <!-- Laptop Base & Screen -->
  <!-- Facing right to left -->
  <path d="M 180 240 L 150 170 L 140 170 L 170 240 Z" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
  <!-- Laptop Keyboard Base -->
  <rect x="165" y="235" width="60" height="5" rx="2" fill="#8b949e"/>
  
  <!-- Glowing Laptop Screen Surface (facing user) -->
  <path d="M 175 235 L 147 172 L 143 174 L 171 237 Z" fill="#7C3AED"/>

  <!-- Programmer -->
  <!-- Legs -->
  <path d="M 295 270 L 260 270 L 260 320" fill="none" stroke="#1f2937" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shoe -->
  <path d="M 250 320 L 270 320" stroke="#4b5563" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Body (Hoodie/Shirt) -->
  <path d="M 330 150 Q 300 120 280 160 L 270 260 L 330 260 Z" fill="#7C3AED"/>
  
  <!-- Head -->
  <circle cx="280" cy="115" r="30" fill="#fca5a5"/>
  <!-- Hair -->
  <path d="M 255 125 Q 260 80 300 95 Q 310 110 310 115 Q 305 75 255 105 Z" fill="#0d1117"/>
  <circle cx="310" cy="110" r="8" fill="#fca5a5"/> <!-- Ear -->
  
  <!-- Glasses -->
  <line x1="250" y1="110" x2="275" y2="110" stroke="#0d1117" stroke-width="3"/>
  <rect x="252" y="105" width="10" height="8" rx="2" fill="none" stroke="#0d1117" stroke-width="2"/>
  <rect x="268" y="105" width="8" height="8" rx="2" fill="none" stroke="#0d1117" stroke-width="2"/>
  
  <!-- Arms & Hands (Animated) -->
  <!-- Left Arm -->
  <path d="M 290 160 Q 260 210 220 230" fill="none" stroke="#58a6ff" stroke-width="14" stroke-linecap="round" class="arm" style="animation-delay: -0.2s;"/>
  <!-- Right Arm (Slightly darker for depth) -->
  <path d="M 300 160 Q 280 200 230 235" fill="none" stroke="#4489dd" stroke-width="14" stroke-linecap="round" class="arm"/>

  <!-- Hands -->
  <circle cx="218" cy="230" r="7" fill="#fca5a5" class="arm" style="animation-delay: -0.2s;"/>
  <circle cx="228" cy="235" r="7" fill="#fca5a5" class="arm"/>

  <!-- Coffee Mug -->
  <rect x="135" y="222" width="12" height="18" rx="2" fill="#ec4899"/>
  <path d="M 135 227 C 130 227 130 237 135 237" fill="none" stroke="#ec4899" stroke-width="2"/>
  
</svg>
